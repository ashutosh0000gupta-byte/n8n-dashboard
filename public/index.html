<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlowCare Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header><div><p class="eyebrow">GLOWCARE</p><h1>Customer dashboard</h1></div><button id="refresh">Refresh</button></header>
    <main>
      <section class="stats" aria-label="Summary">
        <article><span>Customers</span><strong id="customers">—</strong></article>
        <article><span>Orders</span><strong id="orders">—</strong></article>
        <article><span>Active carts</span><strong id="carts">—</strong></article>
      </section>
      <p id="status" role="status"></p>
      <section class="grid">
        <article class="panel"><h2>Recent customers</h2><div id="customer-list"></div></article>
        <article class="panel"><h2>Incoming messages</h2><div id="message-list"></div></article>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
